sonar.projectKey=ServEase-Innovations_payments
sonar.organization=servease-innovations
sonar.projectName=Payments Service

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Test directory
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.test.mjs,**/test/**
sonar.test.inclusions=**/*.test.js,**/*.test.mjs

# Code coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info
