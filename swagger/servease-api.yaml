# `servers` below is replaced at runtime from the current request (or SWAGGER_SERVER_URL, etc.); see index.js
openapi: 3.0.3
info:
  title: Servease API
  description: API for Servease platform - customer, service providers, engagements, payments, wallets
  version: 1.0.3

servers:
  - url: http://localhost:4000/api

tags:
  - name: customer
  - name: Providers
  - name: Engagements
  - name: Payments
  - name: Wallets
  - name : Service Days

paths:
  /engagements/{id}:
    put:
      summary: Update an existing engagement (date, time, etc.)
      tags: [Engagements]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the engagement to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementUpdate"
      responses:
        "200":
          description: Engagement updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "404":
          description: Engagement not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Engagement not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Server error

  /engagements/{id}/accept:
    post:
      summary: Accept an engagement by a provider
      description: >
        Allows a service provider to accept an unassigned engagement.  
        Only the **first provider** to accept will be assigned.  
        If the engagement is already assigned, this request will fail.
      tags:
        - Engagements
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the engagement to accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_id
              properties:
                provider_id:
                  type: integer
                  example: 202
      responses:
        "200":
          description: Engagement successfully assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Engagement assigned successfully
                  engagement:
                    type: object
                    properties:
                      engagement_id:
                        type: integer
                        example: 312
                      serviceproviderid:
                        type: integer
                        example: 202
                      assignment_status:
                        type: string
                        example: ASSIGNED
        "404":
          description: Engagement not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Engagement not found
        "409":
          description: Engagement already assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Engagement already assigned
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Internal server error


  /customers/{customerId}/engagements:
    get:
      summary: Get engagements (bookings) by customer ID
      description: Returns all bookings (engagements) created by a specific customer.
      tags:
        - Engagements
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer whose bookings need to be fetched
          schema:
            type: integer
            example: 11
      responses:
        "200":
          description: Successfully retrieved customer bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Engagement"
        "500":
          description: Server error

  
  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify Razorpay payment and mark as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerify'
      responses:
        "200":
          description: Payment verified and completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment verified and completed successfully
        "400":
          description: Invalid payment signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid payment signature
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Server error

  /payments/{providerId}/payment-history:
    get:
      tags: [Payments]
      summary: Get service provider payment history
      description: >
        Returns the payment history for a service provider, including credits (payouts) and debits (provider fees, security deposits, TDS deductions).  
        Supports ordering by date descending.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: integer
          description: The ID of the service provider
      responses:
        "200":
          description: Successful response with payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  providerId:
                    type: string
                    example: "202"
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1001
                        engagement_id:
                          type: integer
                          example: 3502
                        type:
                          type: string
                          enum: [CREDIT, DEBIT]
                          example: CREDIT
                        amount:
                          type: number
                          format: float
                          example: 4800
                        description:
                          type: string
                          example: "Payout for engagement #3502"
                        date:
                          type: string
                          format: date-time
                          example: "2025-09-10T12:30:00Z"
                        status:
                          type: string
                          example: SUCCESS
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Provider not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Internal server error"

  /payments/{engagementId}/resume:
    get:
      summary: Resume a pending payment
      description: >
        Returns Razorpay order details for an engagement whose payment
        status is still PENDING.  
        Used to allow customers to complete payment later using the same
        Razorpay order.
      tags:
        - Payments
      parameters:
        - in: path
          name: engagementId
          required: true
          schema:
            type: integer
            example: 83
          description: Engagement ID for which payment is pending
      responses:
        "200":
          description: Pending payment details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  razorpay_order_id:
                    type: string
                    example: order_S7QCLkLlfzEvda
                  amount:
                    type: number
                    format: float
                    example: 2236
                  currency:
                    type: string
                    example: INR
        "400":
          description: Payment already completed or invalid state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Payment already completed
        "404":
          description: Payment or engagement not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Payment not found
        "500":
          description: Server error


  /customer/{customerId}/leaves:
    post:
      summary: Apply vacation leave for a customer
      description: >
        Applies vacation leave for SHORT_TERM or MONTHLY engagements.  
        Refund = 75% of vacation amount credited to customer wallet,  
        25% retained by ServEaso.  
        Also records audit logs in **engagement_modifications**.
      tags:
        - Customer Leaves
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer applying leave
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - engagement_id
                - leave_start_date
                - leave_end_date
                - leave_type
              properties:
                engagement_id:
                  type: integer
                  example: 8
                leave_start_date:
                  type: string
                  format: date
                  example: "2025-09-01"
                leave_end_date:
                  type: string
                  format: date
                  example: "2025-09-10"
                leave_type:
                  type: string
                  enum: [VACATION]
                  example: VACATION
      responses:
        "200":
          description: Vacation leave applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Vacation applied successfully
                  leave:
                    type: object
                    properties:
                      leave_id:
                        type: integer
                        example: 301
                      customerid:
                        type: integer
                        example: 1
                      engagement_id:
                        type: integer
                        example: 8
                      leave_start_date:
                        type: string
                        format: date
                        example: "2025-09-01"
                      leave_end_date:
                        type: string
                        format: date
                        example: "2025-09-10"
                      leave_type:
                        type: string
                        example: VACATION
                      total_days:
                        type: integer
                        example: 10
                      refund_amount:
                        type: integer
                        example: 1000
                      status:
                        type: string
                        example: APPROVED
                  refund:
                    type: object
                    properties:
                      wallet_credit:
                        type: integer
                        example: 1000
                      servease_cut:
                        type: integer
                        example: 330
                      vacation_amount:
                        type: integer
                        example: 1330
        "400":
          description: Invalid request (wrong leave type or booking type)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Vacation only applies to SHORT_TERM or MONTHLY bookings"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error applying vacation"

  /wallets/{customerId}:
    get:
      summary: Get wallet balance & transactions of a customer
      description: Returns the current wallet balance and recent transactions for a given customer.
      tags:
        - Wallets
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer whose wallet needs to be fetched
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful response with wallet balance and transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerid:
                    type: integer
                    example: 1
                  wallet_id:
                    type: integer
                    example: 5
                  balance:
                    type: number
                    format: float
                    example: 2700.00
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        transaction_id:
                          type: integer
                          example: 12
                        wallet_id:
                          type: integer
                          example: 5
                        engagement_id:
                          type: integer
                          nullable: true
                          example: 10
                        amount:
                          type: number
                          format: float
                          example: 2700
                        transaction_type:
                          type: string
                          enum: [CREDIT, DEBIT]
                          example: CREDIT
                        description:
                          type: string
                          example: Vacation refund for 9 days
                        balance_after:
                          type: number
                          format: float
                          example: 2700
                        created_at:
                          type: string
                          format: date-time
                          example: 2025-08-28T22:59:57.134Z
        '404':
          description: Wallet not found for this customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Wallet not found for this customer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch wallet

  /service-providers/{providerId}/payouts:
    get:
      summary: Get provider payout summary and details
      description: Returns total earned, withdrawn, available to withdraw, and security deposit info for a provider. Optional monthly filter and detailed payout info.
      tags:
        - Provider
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: integer
          description: ID of the service provider
        - in: query
          name: month
          required: false
          schema:
            type: string
            example: "2025-09"
          description: Filter payouts for a specific month (format: YYYY-MM)
        - in: query
          name: detailed
          required: false
          schema:
            type: boolean
            default: false
          description: If true, returns individual payout details
      responses:
        '200':
          description: Successful response with provider payout summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  serviceproviderid:
                    type: integer
                    example: 202
                  month:
                    type: string
                    nullable: true
                    example: "2025-09"
                  summary:
                    type: object
                    properties:
                      total_earned:
                        type: number
                        format: float
                        example: 20000
                      total_withdrawn:
                        type: number
                        format: float
                        example: 15000
                      available_to_withdraw:
                        type: number
                        format: float
                        example: 5000
                      security_deposit_paid:
                        type: boolean
                        example: true
                      security_deposit_amount:
                        type: number
                        format: float
                        example: 5000
                  payouts:
                    type: array
                    items:
                      type: object
                      properties:
                        payout_id:
                          type: integer
                          example: 301
                        engagement_id:
                          type: integer
                          example: 173
                        gross_amount:
                          type: number
                          format: float
                          example: 2000
                        provider_fee:
                          type: number
                          format: float
                          example: 200
                        tds_amount:
                          type: number
                          format: float
                          example: 0
                        net_amount:
                          type: number
                          format: float
                          example: 1800
                        payout_mode:
                          type: string
                          example: bank_transfer
                        status:
                          type: string
                          example: SUCCESS
                        created_at:
                          type: string
                          format: date-time
                          example: "2025-09-01T10:00:00Z"
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Provider not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string

  /service-providers/{providerId}/withdrawal-history:
    get:
      summary: Service provider wallet and withdrawal history
      description: Returns wallet summary, ledger transactions (newest first), and withdrawal/payout requests with status.
      tags:
        - Provider
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: integer
        - in: query
          name: month
          required: false
          schema:
            type: string
            example: "2025-09"
      responses:
        '200':
          description: Wallet summary, ledger, and withdrawals
        '404':
          description: Provider not found
        '500':
          description: Internal server error

  /service-providers/{providerId}/engagements:
    get:
      summary: Get engagements for a service provider
      description: >
        Fetches all engagements for a given service provider.  
        Supports optional filters by engagement status and month.
      tags:
        - Provider
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
          description: The unique ID of the service provider
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, CANCELLED]
          description: Filter engagements by task status
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            example: "2025-09"
          description: Filter engagements by start date month (format YYYY-MM)
      responses:
        "200":
          description: List of engagements for the provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  serviceproviderid:
                    type: string
                    example: "123"
                  engagements:
                    type: array
                    items:
                      type: object
                      properties:
                        engagementid:
                          type: string
                          example: "456"
                        customerid:
                          type: string
                          example: "789"
                        serviceproviderid:
                          type: string
                          example: "123"
                        start_date:
                          type: string
                          format: date
                          example: "2025-09-10"
                        end_date:
                          type: string
                          format: date
                          example: "2025-09-15"
                        start_time:
                          type: string
                          format: time
                          example: "10:00:00"
                        end_time:
                          type: string
                          format: time
                          example: "18:00:00"
                        responsibilities:
                          type: object
                          example: { cooking: true, cleaning: false }
                        booking_type:
                          type: string
                          example: "ON_DEMAND"
                        service_type:
                          type: string
                          example: "COOK"
                        task_status:
                          type: string
                          example: "IN_PROGRESS"
                        base_amount:
                          type: number
                          format: float
                          example: 5000.00
                        created_at:
                          type: string
                          format: date-time
                          example: "2025-09-01T12:30:00Z"
                        customer_name:
                          type: string
                          example: "John Doe"
                        customer_phone:
                          type: string
                          example: "+91-9876543210"
        "400":
          description: Invalid request (bad month format or params)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Invalid month format. Use YYYY-MM"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Provider not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Internal server error"

  /engagement-service/service-days/{id}/otp:
    post:
      summary: Generate OTP for service completion
      description: >
        Generates a 6-digit OTP for a service day.
        OTP expires in 10 minutes and is sent to the customer.
      tags: [Service Days]
      parameters:
        - in: path
          name: id
          required: true
          description: Service Day ID
          schema:
            type: integer
            example: 101
      responses:
        "200":
          description: OTP generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardMessage"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /engagement-service/service-days/{id}/complete:
    post:
      summary: Complete service day using OTP
      description: >
        Verifies OTP, marks the service day as COMPLETED,
        and credits the provider with daily earnings.
      tags: [Service Days]
      parameters:
        - in: path
          name: id
          required: true
          description: Service Day ID
          schema:
            type: integer
            example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteServiceDayRequest"
      responses:
        "200":
          description: Service completed and earnings credited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Service completed & earnings credited
                  dailyRate:
                    type: number
                    format: float
                    example: 183.33
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /engagement-service/engagements/{engagementId}/service-days:
    get:
      summary: Get service days for an engagement
      description: >
        Returns all service days created for an engagement,
        including their status and timestamps.
      tags: [Service Days]
      parameters:
        - in: path
          name: engagementId
          required: true
          schema:
            type: integer
            example: 14
      responses:
        "200":
          description: List of service days
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  engagement_id:
                    type: integer
                    example: 14
                  service_days:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceDay"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /engagement-service/engagements/{engagementId}/service-days/today:
    get:
      summary: Get today's service day for an engagement
      description: >
        Returns the service day scheduled for today (if any).
        Useful for OTP and task execution flows.
      tags: [Service Days]
      parameters:
        - in: path
          name: engagementId
          required: true
          schema:
            type: integer
            example: 14
      responses:
        "200":
          description: Today's service day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  service_day:
                    $ref: "#/components/schemas/ServiceDay"
        "404":
          description: No service scheduled today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /engagement-service/service-days/{id}/start:
    post:
      summary: Start a service day
      description: >
        Marks a service day as **IN_PROGRESS**.
        This endpoint is called by the service provider when starting work
        for a scheduled service day.
      tags:
        - Service Days
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the service day
          schema:
            type: integer
            example: 101
      responses:
        "200":
          description: Service started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Service started
        "400":
          description: Service cannot be started (invalid status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service cannot be started
        "404":
          description: Service day not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service day not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unexpected server error

  /admin/payments/summary:
    get:
      summary: Get payment summary (Admin dashboard)
      description: >
        Returns aggregated payment metrics for admin dashboard
        (total revenue, GST, platform fee, net revenue).
      tags:
        - Admin Payments
      responses:
        "200":
          description: Payment summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  summary:
                    $ref: "#/components/schemas/AdminPaymentSummary"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Server error


  /admin/payments:
    get:
      summary: Get all payments (Admin)
      description: >
        Returns a paginated list of all payments with optional filters.
        Accessible only to ADMIN users.
      tags:
        - Admin Payments
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, SUCCESS, FAILED, REFUNDED]
          example: SUCCESS
        - in: query
          name: payment_mode
          schema:
            type: string
            example: razorpay

        - in: query
          name: engagement_id
          schema:
            type: integer
            example: 42

        - in: query
          name: from
          description: Start date (ISO format)
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - in: query
          name: to
          description: End date (ISO format)
          schema:
            type: string
            format: date
            example: "2026-01-31"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20

        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Payments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminPayment"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Admin only)
        "500":
          description: Server error

  /admin/ledger:
    get:
      summary: Get Serveaso ledger (Admin)
      description: >
        Returns the **platform ledger** showing all money movement
        including customer payments and provider payouts.
        Also returns a summary useful for admin dashboards.
      tags:
        - Admin Payments
      parameters:
        - in: query
          name: from
          description: Filter ledger from this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-01-01"

        - in: query
          name: to
          description: Filter ledger up to this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-01-31"

        - in: query
          name: limit
          description: Number of records to return
          schema:
            type: integer
            default: 50
            example: 50

        - in: query
          name: offset
          description: Pagination offset
          schema:
            type: integer
            default: 0
            example: 0

      responses:
        "200":
          description: Ledger fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  summary:
                    $ref: "#/components/schemas/AdminLedgerSummary"

                  ledger:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminLedgerEntry"

                  count:
                    type: integer
                    example: 25

        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Admin only)
        "500":
          description: Internal server error

  /admin/engagements:
    get:
      summary: Get all engagements (Admin)
      description: >
        Returns a paginated list of all engagements with customer, provider,
        and payment details. Supports filters like booking type, service type,
        assignment status, activity state, and date range.
      tags:
        - Admin Engagements
      parameters:
        - in: query
          name: booking_type
          schema:
            type: string
            enum: [ON_DEMAND, MONTHLY]
          example: ON_DEMAND

        - in: query
          name: service_type
          schema:
            type: string
          example: COOK

        - in: query
          name: assignment_status
          schema:
            type: string
            enum: [ASSIGNED, UNASSIGNED]
          example: ASSIGNED

        - in: query
          name: active
          schema:
            type: boolean
          example: true

        - in: query
          name: from
          description: Filter engagements starting from this date
          schema:
            type: string
            format: date
          example: "2026-01-01"

        - in: query
          name: to
          description: Filter engagements ending before this date
          schema:
            type: string
            format: date
          example: "2026-01-31"

        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          example: 20

        - in: query
          name: offset
          schema:
            type: integer
            default: 0
          example: 0
      responses:
        "200":
          description: Engagements fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 125
                  engagements:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminEngagement"

        "401":
          description: Unauthorized

        "403":
          description: Forbidden (Admin only)

        "500":
          description: Internal server error


  
  
  /service-providers/{providerId}/withdraw:
    post:
      summary: Provider wallet withdrawal
      description: >
        Allows a service provider to withdraw available wallet balance.
        Creates a payout record, deducts wallet balance, and reflects in admin ledger.
      tags:
        - Provider Wallet
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: integer
          example: 3403
          description: Service Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: float
                  example: 2500
                  description: Amount to withdraw
                payout_mode:
                  type: string
                  enum: [BANK, UPI]
                  example: BANK
                  description: Mode of payout
      responses:
        "200":
          description: Withdrawal successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Withdrawal successful
                  remaining_balance:
                    type: number
                    example: 3649
                  payout:
                    type: object
                    properties:
                      payout_id:
                        type: integer
                        example: 101
                      serviceproviderid:
                        type: integer
                        example: 3403
                      gross_amount:
                        type: number
                        example: 2500
                      provider_fee:
                        type: number
                        example: 0
                      tds_amount:
                        type: number
                        example: 25
                      net_amount:
                        type: number
                        example: 2475
                      payout_mode:
                        type: string
                        example: BANK
                      status:
                        type: string
                        example: SUCCESS
                      created_at:
                        type: string
                        format: date-time
        "400":
          description: Invalid request or insufficient balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Insufficient balance
        "404":
          description: Provider wallet not found
        "500":
          description: Internal server error


  

components:
  schemas:
    Engagement:
      type: object
      properties:
        engagement_id: { type: integer }
        customerid: { type: integer }
        serviceproviderid: { type: integer }
        service_type: { type: string }
        booking_type: { type: string }
        responsibilities:
          type: object
          additionalProperties: true
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        start_time: { type: string, format: time, example: "10:00:00" }
        end_time: { type: string, format: time, example: "11:00:00" }
        base_amount: { type: number, format: float }
        task_status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED], description: "Effective work status (derived for customer list — see work_summary)" }
        task_status_stored: { type: string, description: "Value persisted on engagements row (may lag until a lifecycle / visit update runs)" }
        work_summary:
          type: object
          description: Human context for task_status
          properties:
            phase: { type: string, enum: [upcoming, active, past] }
            label: { type: string }
            engagement_status: { type: string, nullable: true }
            today_visit:
              type: object
              nullable: true
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    EngagementUpdate:
      type: object
      properties:
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        start_time: { type: string, format: time, example: "10:00:00" }
        end_time: { type: string, format: time, example: "11:00:00" }
        task_status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
        active: { type: boolean }

    Payment:
      type: object
      properties:
        payment_id: { type: integer }
        engagement_id: { type: integer }
        base_amount: { type: number, format: float }
        platform_fee: { type: number, format: float }
        gst: { type: number, format: float }
        total_amount: { type: number, format: float }
        payment_mode: { type: string }
        transaction_id: { type: string, nullable: true }
        razorpay_order_id: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        created_at: { type: string, format: date-time }

    Payout:
      type: object
      properties:
        payout_id: { type: integer }
        serviceproviderid: { type: integer }
        engagement_id: { type: integer }
        gross_amount: { type: number, format: float }
        provider_fee: { type: number, format: float }
        tds_amount: { type: number, format: float }
        net_amount: { type: number, format: float }
        payout_mode: { type: string, nullable: true }
        transaction_id: { type: string, nullable: true }
        status: { type: string, enum: [INITIATED, SUCCESS, FAILED] }
        created_at: { type: string, format: date-time }

    EngagementCreate:
      type: object
      required:
        - customerid
        - serviceproviderid
        - service_type
        - booking_type
        - start_date
        - end_date
        - start_time
        - base_amount
        - payment_mode
      properties:
        customerid: { type: integer }
        serviceproviderid: { type: integer }
        service_type: { type: string }
        booking_type: { type: string }
        responsibilities:
          type: object
          additionalProperties: true
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        start_time: { type: string, format: time, example: "10:00:00" }
        end_time: { type: string, format: time, example: "11:00:00" }
        base_amount: { type: number, format: float }
        payment_mode: { type: string }

    EngagementFull:
      type: object
      properties:
        message: { type: string }
        engagement:
          $ref: "#/components/schemas/Engagement"
        payment:
          $ref: "#/components/schemas/Payment"
        payout:
          $ref: "#/components/schemas/Payout"

    PaymentVerify:
      type: object
      required:
        - engagementId
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
      properties:
        engagementId:
          type: integer
          example: 6
        razorpayOrderId:
          type: string
          example: order_R9vaJwN8q3rbUz
        razorpayPaymentId:
          type: string
          example: pay_1234567890
        razorpaySignature:
          type: string
          example: f3b2c1d4e5a6b7c8d9f0

    ServiceDay:
      type: object
      properties:
        service_day_id:
          type: integer
          example: 101
        engagement_id:
          type: integer
          example: 14
        service_date:
          type: string
          format: date
          example: "2025-12-22"
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, MISSED, VACATION]
          example: COMPLETED
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        otp_verified:
          type: boolean
          example: true

    CompleteServiceDayRequest:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: "482913"

    StandardMessage:
      type: object
      properties:
        message:
          type: string
          example: Operation successful


    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid or expired OTP


    